name: Native predictive-back prototype
on:
  workflow_dispatch:
  workflow_call:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35, 36]
    env:
      # Experimental upstream proposal #11558; do not silently follow its branch.
      CORE_REVISION: fadb58f034e403933028f86746280375ea9811ff
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: rafaelaugustos/NativeScript
          ref: ${{ env.CORE_REVISION }}
          path: .native-core
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm ci && npm run build
      - name: Build the pinned Core candidate
        working-directory: .native-core
        run: |
          npm ci --no-audit --no-fund
          npx nx run core:build
      - run: npm install --no-audit --no-fund
        working-directory: demo
      - name: Pin the released Core negative control and native resources
        working-directory: demo
        run: npm install --no-save --package-lock=false @nativescript/core@9.1.3
      - run: npm install -g nativescript
      - name: Prepare native resources
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator >/dev/null
          ns usage-reporting disable
          ns error-reporting disable
          ns create predictive-scaffold --template @nativescript/template-blank-ts --path /tmp >/dev/null
          cp -R /tmp/predictive-scaffold/App_Resources demo/App_Resources
          node scripts/native/contracts/prepare.mjs
      - name: Install emulator image
        run: |
          for attempt in 1 2 3; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'system-images;android-${{ matrix.api }};google_apis;x86_64' && test -s "$ANDROID_HOME/system-images/android-${{ matrix.api }}/google_apis/x86_64/system.img"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Build released and candidate native fixtures
        working-directory: demo
        run: |
          if [ '${{ matrix.api }}' = '35' ]; then
            ns build android --env.predictiveplainTest
            cp platforms/android/app/build/outputs/apk/debug/app-debug.apk /tmp/predictive-stock.apk
          fi
          ns build android --env.predictiveplainTest --env.predictiveCore="$GITHUB_WORKSPACE/.native-core/dist/packages/core"
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk /tmp/predictive-plain.apk
          ns build android --env.predictiveTest --env.predictiveCore="$GITHUB_WORKSPACE/.native-core/dist/packages/core"
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk /tmp/predictive-router.apk
      - run: node scripts/native/contracts/build-touch.mjs
      - name: Compare native previews and Activity recreation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            ANDROID_SERIAL=emulator-5554 ANDROID_APP=/tmp/predictive-router.apk PREVIEW_MODE=core OUT=scripts/native/out/predictive-core node scripts/native/predictive/android.mjs
            ANDROID_SERIAL=emulator-5554 PREVIEW_MODE=legacy OUT=scripts/native/out/predictive-legacy node scripts/native/predictive/android.mjs
            ANDROID_SERIAL=emulator-5554 ANDROID_APP=/tmp/predictive-plain.apk OUT=scripts/native/out/predictive-recreation node scripts/native/predictive/recreation.mjs
            if [ '${{ matrix.api }}' = '35' ]; then ANDROID_SERIAL=emulator-5554 ANDROID_APP=/tmp/predictive-stock.apk PREVIEW_MODE=legacy EXPECT_RECREATION_FAILURE=1 OUT=scripts/native/out/predictive-negative node scripts/native/predictive/recreation.mjs; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: predictive-android-${{ matrix.api }}
          path: scripts/native/out

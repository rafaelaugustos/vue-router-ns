name: Native flows
on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/native-flows.ts
      - src/flows/**
      - test/native-flows.spec.ts
      - test/shims/core.ts
      - demo/src/testing/flows-app.ts
      - demo/webpack.config.js
      - scripts/native/flows-android.mjs
      - scripts/native/prepare-flows.py
      - scripts/native/ios-flows/**
      - .github/workflows/native-flows.yml
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm ci && npm run build
      - run: npm install --no-audit --no-fund
        working-directory: demo
      - run: npm install -g nativescript
      - name: Prepare NativeScript
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator >/dev/null
          ns usage-reporting disable
          ns error-reporting disable
          ns create flow-scaffold --template @nativescript/template-blank-ts --path /tmp >/dev/null
          cp -R /tmp/flow-scaffold/App_Resources demo/App_Resources
      - name: Install the emulator image
        # SDK downloads occasionally return a truncated archive; validate before
        # entering emulator-runner so a retry does not rebuild the entire job.
        run: |
          for attempt in 1 2 3; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'system-images;android-35;google_apis;x86_64' && test -s "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/system.img"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - run: ns build android --env.flowsTest
        working-directory: demo
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r demo/platforms/android/app/build/outputs/apk/debug/app-debug.apk
            ANDROID_SERIAL=emulator-5554 node scripts/native/flows-android.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flows-android
          path: scripts/native/out/flows-android
  ios:
    # Hosted macOS 26 ARM FileProvider fails even in a UIKit-only control.
    # Keep the older host OS and ARM runtime; see test/native-flows.md.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install cocoapods xcodeproj --no-document
      - run: npm ci && npm run build
      - run: npm install --no-audit --no-fund
        working-directory: demo
      - run: npm install -g nativescript
      - name: Prepare NativeScript
        run: |
          ns usage-reporting disable
          ns error-reporting disable
          ns create flow-scaffold --template @nativescript/template-blank-ts --path /tmp >/dev/null
          cp -R /tmp/flow-scaffold/App_Resources demo/App_Resources
          python3 scripts/native/prepare-flows.py
      - run: ns build ios --for-device false --env.flowsTest
        working-directory: demo
      - name: Drive the system picker with XCTest
        run: |
          # Pin the native acceptance baseline and isolate its storage.
          RUNTIME=com.apple.CoreSimulator.SimRuntime.iOS-18-6
          SIM=$(xcrun simctl create RouterFlows com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro "$RUNTIME")
          echo "Testing $SIM on $RUNTIME"
          trap 'xcrun simctl shutdown "$SIM"; xcrun simctl delete "$SIM"' EXIT
          xcrun simctl boot "$SIM"
          xcrun simctl bootstatus "$SIM" -b
          xcrun simctl install "$SIM" demo/platforms/ios/build/Debug-iphonesimulator/demo.app
          python3 scripts/native/ios-flows/seed-document.py "$SIM"
          ruby scripts/native/ios-flows/project.rb /tmp/router-flow-tests
          mkdir -p scripts/native/out/flows-ios
          set +e
          xcodebuild test -project /tmp/router-flow-tests/FlowChecks.xcodeproj -scheme FlowChecks -destination "platform=iOS Simulator,id=$SIM" -derivedDataPath /tmp/router-flow-tests/build -collect-test-diagnostics never -resultBundlePath scripts/native/out/flows-ios/FlowChecks.xcresult
          test_status=$?
          xcrun simctl spawn "$SIM" log show --last 10m --style compact --predicate 'process == "demo" OR eventMessage CONTAINS "FLOW_" OR subsystem CONTAINS[c] "FileProvider" OR subsystem CONTAINS[c] "DocumentManager" OR process == "ResolverService"' > scripts/native/out/flows-ios/runtime.log
          DATA=$(xcrun simctl get_app_container "$SIM" org.nativescript.vuerouterns data)
          ls -l "$DATA/Documents" > scripts/native/out/flows-ios/documents.txt
          exit "$test_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flows-ios
          path: scripts/native/out/flows-ios

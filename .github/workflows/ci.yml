name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '20.19.4'
            npm: '10.8.2'
          - node: '22.23.3'
            npm: '10.8.2'
          - node: '22.23.3'
            npm: '11.21.1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@${{ matrix.npm }}
      - run: npm ci
      - name: Install the packed package into fresh NativeScript apps
        env:
          INSTALL_REPORTS: /tmp/router-install-reports
        run: |
          npm pack --pack-destination /tmp --json > /tmp/router-pack.json
          package_file=$(node -p "'/tmp/' + require('/tmp/router-pack.json')[0].filename")
          node scripts/check-install.mjs "$package_file"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-node-${{ matrix.node }}-npm-${{ matrix.npm }}
          path: /tmp/router-install-reports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: bash scripts/native/test-ui.sh
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run docs:build

  playground:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/playground
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/playground/package-lock.json
      - name: Build and pack the candidate router
        working-directory: .
        run: |
          npm ci
          npm pack --pack-destination /tmp --json > /tmp/playground-router-pack.json
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('/tmp/playground-router-pack.json')); fs.appendFileSync(process.env.GITHUB_ENV, 'ROUTER_TARBALL=/tmp/'+p[0].filename+'\n')"
      - run: npm ci
      - name: Validate the playground against this candidate
        run: npm install --no-save --package-lock=false "$ROUTER_TARBALL"
      - run: npm run typecheck
      - run: npm run build:android
      - run: npm run build:ios

  file-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/file-routing/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: examples/file-routing
      - name: Prepare types and inspect both native bundles
        working-directory: examples/file-routing
        run: |
          npm run routes:android
          npm run typecheck
          npm run build:android -- --env sourceMap
          node scripts/check-bundle.mjs android
          npm run routes:ios
          npm run typecheck
          npm run build:ios -- --env sourceMap
          node scripts/check-bundle.mjs ios
      - name: Build both native platforms with Vite (without HMR)
        working-directory: examples/file-routing
        run: |
          npm run build:vite:android
          ROUTER_BUNDLER=vite node scripts/check-bundle.mjs android
          npm run build:vite:ios
          ROUTER_BUNDLER=vite node scripts/check-bundle.mjs ios

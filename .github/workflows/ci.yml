name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: bash scripts/native/test-ui.sh
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run docs:build

  playground:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/playground
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/playground/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:android
      - run: npm run build:ios

name: Release

# Publish only after the complete CI/native suites pass on this main commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      dist-tag: ${{ steps.check.outputs.dist-tag }}
      published: ${{ steps.check.outputs.published }}
      released: ${{ steps.check.outputs.released }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check what is already out
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then tag=next; else tag=latest; fi
          echo "dist-tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi
  ci:
    needs: check
    if: needs.check.outputs.published != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      full: true
  native:
    needs: check
    if: needs.check.outputs.published != 'true'
    uses: ./.github/workflows/native-contracts.yml
  release:
    needs: [check, ci, native]
    if: >-
      always() && needs.check.result == 'success' &&
      (needs.check.outputs.published == 'true' ||
      (needs.ci.result == 'success' && needs.native.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5+
      - if: needs.check.outputs.published != 'true'
        run: npm install --global npm@11
      - if: needs.check.outputs.published != 'true'
        run: npm ci
      - if: needs.check.outputs.published != 'true'
        run: npm run typecheck
      - if: needs.check.outputs.published != 'true'
        run: npm test

      - name: Pack the validated commit
        if: needs.check.outputs.published != 'true'
        run: |
          mkdir -p /tmp/router-release
          npm pack --pack-destination /tmp/router-release --json > /tmp/router-release/pack.json
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('/tmp/router-release/pack.json')); fs.appendFileSync(process.env.GITHUB_ENV, 'ROUTER_TARBALL=/tmp/router-release/'+p[0].filename+'\n')"
      - name: Verify the publication artifact in fresh apps
        if: needs.check.outputs.published != 'true'
        env:
          INSTALL_REPORTS: /tmp/router-release/install
        run: node scripts/check-install.mjs "$ROUTER_TARBALL"
      - uses: actions/upload-artifact@v4
        if: always() && needs.check.outputs.published != 'true'
        with:
          name: release-package
          path: /tmp/router-release
      - name: Publish to npm
        if: needs.check.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$ROUTER_TARBALL" --provenance --access public --tag "${{ needs.check.outputs.dist-tag }}"

      - name: Point latest at the newest pre-release
        if: needs.check.outputs.dist-tag == 'next'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          name=$(node -p "require('./package.json').name")
          latest=$(npm view "$name" dist-tags.latest)
          if [[ "$latest" == *-* && "$latest" != "$VERSION" ]]; then
            npm dist-tag add "$name@$VERSION" latest
          fi

      - name: Create the GitHub release
        if: needs.check.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            /^## / { if (found) exit; found = index($0, "## " version " ") == 1 || $0 == "## " version; next }
            found
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See [CHANGELOG.md](CHANGELOG.md)." > notes.md

          flags=()
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md "${flags[@]}"

name: Native iOS drawer
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      scope:
        description: Drawer acceptance scope
        type: choice
        options: [all, content-back, programmatic-overlap, gesture-rotation]
        default: all
permissions:
  contents: read
jobs:
  drawer:
    if: inputs.scope != 'content-back' && inputs.scope != 'programmatic-overlap' && inputs.scope != 'gesture-rotation'
    runs-on: macos-15-intel
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone-16, iPad-Pro-11-inch-M4-8GB]
        suite: [drawer, adaptive]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install cocoapods xcodeproj --no-document
      - run: npm ci && npm run build
      - run: npm install --no-audit --no-fund
        working-directory: demo
      - run: npm install -g nativescript
      - name: Prepare native resources
        run: |
          ns usage-reporting disable
          ns error-reporting disable
          ns create drawer-scaffold --template @nativescript/template-blank-ts --path /tmp >/dev/null
          cp -R /tmp/drawer-scaffold/App_Resources demo/App_Resources
      - run: ns build ios --for-device false --env.drawerTest
        if: matrix.suite == 'drawer'
        working-directory: demo
      - name: Build adaptive drawer fixture
        if: matrix.suite == 'adaptive'
        run: ns build ios --for-device false --env.adaptivedrawerTest
        working-directory: demo
      - name: Create dedicated simulator
        run: |
          SIM=$(xcrun simctl create RouterDrawer-${{ matrix.suite }} com.apple.CoreSimulator.SimDeviceType.${{ matrix.device }} com.apple.CoreSimulator.SimRuntime.iOS-18-6)
          echo "IOS_SIMULATOR=$SIM" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM"
          xcrun simctl bootstatus "$SIM" -b
      - name: Binding, accessibility state and lifecycle contracts
        if: matrix.suite == 'drawer'
        run: node scripts/native/drawer-ios/run.mjs
      - name: Reduce Motion contracts
        if: matrix.suite == 'drawer'
        run: |
          xcrun simctl spawn "$IOS_SIMULATOR" defaults write com.apple.Accessibility ReduceMotionEnabled -bool YES
          EXPECT_REDUCED_MOTION=1 OUT=scripts/native/out/drawer-reduced-motion node scripts/native/drawer-ios/run.mjs
          xcrun simctl spawn "$IOS_SIMULATOR" defaults delete com.apple.Accessibility ReduceMotionEnabled
      - name: Real native input, navigation and rotation
        if: matrix.suite == 'drawer'
        run: |
          xcrun simctl uninstall "$IOS_SIMULATOR" org.nativescript.vuerouterns
          xcrun simctl install "$IOS_SIMULATOR" demo/platforms/ios/build/Debug-iphonesimulator/demo.app
          ruby scripts/native/drawer-ios/project.rb /tmp/router-drawer-tests
          node scripts/native/command-timeout.mjs 600000 xcodebuild test \
            -project /tmp/router-drawer-tests/DrawerChecks.xcodeproj -scheme DrawerChecks \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR" \
            -derivedDataPath /tmp/router-drawer-tests/build -collect-test-diagnostics never \
            -resultBundlePath scripts/native/out/drawer-ios/checks.xcresult
      - name: Adaptive identity, state and modal contracts
        if: matrix.suite == 'adaptive'
        run: OUT=scripts/native/out/adaptive-ios node scripts/native/adaptive-drawer/run.mjs
      - name: Adaptive Reduce Motion contracts
        if: matrix.suite == 'adaptive'
        run: |
          xcrun simctl spawn "$IOS_SIMULATOR" defaults write com.apple.Accessibility ReduceMotionEnabled -bool YES
          EXPECT_REDUCED_MOTION=1 OUT=scripts/native/out/adaptive-reduced-motion node scripts/native/adaptive-drawer/run.mjs
          xcrun simctl spawn "$IOS_SIMULATOR" defaults delete com.apple.Accessibility ReduceMotionEnabled
      - name: Adaptive native input and rotation
        if: matrix.suite == 'adaptive'
        run: |
          xcrun simctl uninstall "$IOS_SIMULATOR" org.nativescript.vuerouterns
          xcrun simctl install "$IOS_SIMULATOR" demo/platforms/ios/build/Debug-iphonesimulator/demo.app
          ruby scripts/native/adaptive-drawer/project.rb /tmp/router-adaptive-tests
          node scripts/native/command-timeout.mjs 600000 xcodebuild test \
            -project /tmp/router-adaptive-tests/AdaptiveDrawerChecks.xcodeproj -scheme AdaptiveDrawerChecks \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR" \
            -derivedDataPath /tmp/router-adaptive-tests/build -collect-test-diagnostics never \
            -resultBundlePath scripts/native/out/adaptive-ios/checks.xcresult
      - name: iPad rotation requested during active navigation
        if: matrix.suite == 'adaptive' && matrix.device == 'iPad-Pro-11-inch-M4-8GB'
        env:
          RECORD_VIDEO: '1'
        run: OUT=scripts/native/out/adaptive-rotation node scripts/native/adaptive-drawer/rotation.mjs
      - name: Clean up dedicated simulator
        if: always() && env.IOS_SIMULATOR != ''
        run: |
          xcrun simctl shutdown "$IOS_SIMULATOR"
          xcrun simctl delete "$IOS_SIMULATOR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drawer-${{ matrix.device }}-${{ matrix.suite }}
          path: scripts/native/out
  content-back:
    if: inputs.scope != 'programmatic-overlap' && inputs.scope != 'gesture-rotation'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install cocoapods xcodeproj --no-document
      - run: npm ci && npm run build
      - run: npm install --no-audit --no-fund
        working-directory: demo
      - run: npm install -g nativescript
      - name: Prepare native resources
        run: |
          ns usage-reporting disable
          ns error-reporting disable
          ns create content-back-scaffold --template @nativescript/template-blank-ts --path /tmp >/dev/null
          cp -R /tmp/content-back-scaffold/App_Resources demo/App_Resources
      - name: Build adaptive drawer fixture with published Core
        run: ns build ios --for-device false --env.adaptivedrawerTest
        working-directory: demo
      - name: Create dedicated iPadOS 26.2 simulator
        run: |
          SIM=$(xcrun simctl create ContentBack168 com.apple.CoreSimulator.SimDeviceType.iPad-Pro-11-inch-M4-8GB com.apple.CoreSimulator.SimRuntime.iOS-26-2)
          echo "IOS_SIMULATOR=$SIM" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM"
          xcrun simctl bootstatus "$SIM" -b
      - name: Require actual committed and cancelled content Back during rotation
        timeout-minutes: 12
        env:
          RECORD_VIDEO: '1'
        run: OUT=scripts/native/out/content-back node scripts/native/adaptive-drawer/rotation.mjs
      - name: Clean up dedicated simulator
        if: always() && env.IOS_SIMULATOR != ''
        run: |
          xcrun simctl shutdown "$IOS_SIMULATOR"
          xcrun simctl delete "$IOS_SIMULATOR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-back-ipad-26.2
          path: scripts/native/out/content-back

  programmatic-overlap:
    if: inputs.scope != 'content-back'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            runtime: '18-6'
          - runner: macos-26
            runtime: '26-2'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install cocoapods xcodeproj --no-document
      - run: npm ci && npm run build
      - run: npm install --no-audit --no-fund
        working-directory: demo
      - run: npm install -g nativescript
      - name: Prepare native resources
        run: |
          ns usage-reporting disable
          ns error-reporting disable
          ns create rotation-scaffold --template @nativescript/template-blank-ts --path /tmp >/dev/null
          cp -R /tmp/rotation-scaffold/App_Resources demo/App_Resources
      - name: Build the adaptive fixture with published Core
        run: ns build ios --for-device false --env.adaptivedrawerTest
        working-directory: demo
      - name: Create dedicated iPad simulator
        run: |
          SIM=$(xcrun simctl create RotationOverlap167 com.apple.CoreSimulator.SimDeviceType.iPad-Pro-11-inch-M4-8GB com.apple.CoreSimulator.SimRuntime.iOS-${{ matrix.runtime }})
          echo "IOS_SIMULATOR=$SIM" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM"
          xcrun simctl bootstatus "$SIM" -b
      - name: Observe device rotation during active gesture input
        if: inputs.scope != 'programmatic-overlap'
        timeout-minutes: 12
        env:
          ROTATION_MODE: gesture
          RECORD_VIDEO: '1'
        run: OUT=scripts/native/out/gesture-rotation node scripts/native/adaptive-drawer/rotation.mjs
      - name: Require actual programmatic overlap in both orientations
        timeout-minutes: 12
        env:
          ROTATION_MODE: overlap
          RECORD_VIDEO: '1'
        run: OUT=scripts/native/out/programmatic-overlap node scripts/native/adaptive-drawer/rotation.mjs
      - name: Preserve default-transition and content-Back acceptance
        timeout-minutes: 12
        run: OUT=scripts/native/out/default-rotation node scripts/native/adaptive-drawer/rotation.mjs
      - name: Clean up dedicated simulator
        if: always() && env.IOS_SIMULATOR != ''
        run: |
          xcrun simctl shutdown "$IOS_SIMULATOR"
          xcrun simctl delete "$IOS_SIMULATOR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: programmatic-overlap-ipad-${{ matrix.runtime }}
          path: scripts/native/out

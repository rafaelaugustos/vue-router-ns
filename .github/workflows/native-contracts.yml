name: Native contracts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spotlight:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install cocoapods xcodeproj --no-document
      - run: npm ci && npm run build
      - run: npm install --no-audit --no-fund
        working-directory: demo
      - run: npm install -g nativescript
      - name: Prepare fresh incoming destination fixture
        run: |
          ns usage-reporting disable
          ns error-reporting disable
          ns create entrypoint-scaffold --template @nativescript/template-blank-ts --path /tmp >/dev/null
          cp -R /tmp/entrypoint-scaffold/App_Resources demo/App_Resources
          python3 scripts/native/entrypoints/prepare.py
      - run: ns build ios --for-device false --env.entrypointsTest
        working-directory: demo
      - name: Create dedicated simulator
        run: |
          SIM=$(xcrun simctl create RouterSpotlight com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M4-8GB com.apple.CoreSimulator.SimRuntime.iOS-26-5)
          echo "IOS_SIMULATOR=$SIM" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM"
          xcrun simctl bootstatus "$SIM" -b
      - name: Native Spotlight on a fresh fixture
        env:
          ENTRYPOINT_TEST: testSystemSearch
        run: node scripts/native/entrypoints/ios.mjs
      - name: Clean up dedicated simulator
        if: always() && env.IOS_SIMULATOR != ''
        run: |
          xcrun simctl shutdown "$IOS_SIMULATOR"
          xcrun simctl delete "$IOS_SIMULATOR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotlight-fresh
          path: scripts/native/out
